[project]
name = "risklens"
version = "0.1.0"
description = "RiskLens ML package: credit-risk & fraud models, features, evaluation, monitoring"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "typer>=0.12",
]

[project.optional-dependencies]
# everything needed to run the full training pipeline
train = [
    "catboost>=1.2",
    "shap>=0.45",
    "optuna>=3.6",
    "mlflow>=2.14",
    "pandera>=0.20",
    "fairlearn>=0.10",
    "matplotlib>=3.8",
    "imbalanced-learn>=0.12",
    "boto3>=1.34",
    "kaggle>=1.6",
]
# loading models in the serving container
serve = ["mlflow>=2.14", "boto3>=1.34"]
# drift reports (used by the Celery worker)
monitoring = ["evidently>=0.4"]

[project.scripts]
risklens = "risklens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risklens"]

[tool.hatch.build.targets.wheel.force-include]
"src/risklens/explain/reason_codes.yaml" = "risklens/explain/reason_codes.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: smoke training runs (deselect with -m 'not slow')"]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels: {{- include "risklens.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: { matchLabels: { app: {{ .Release.Name }}-frontend } }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-frontend }
    spec:
      containers:
        - name: frontend
          image: {{ include "risklens.image" (dict "root" . "name" "frontend") }}
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  selector: { app: {{ .Release.Name }}-frontend }
  ports: [{ port: 80, targetPort: 8080 }]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls: [{ hosts: [{{ .Values.ingress.host }}], secretName: {{ .Values.ingress.tls.secretName }} }]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-backend, port: { number: 8000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-frontend, port: { number: 80 } } } }
{{- end }}

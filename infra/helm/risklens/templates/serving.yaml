apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-serving
  labels: {{- include "risklens.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.serving.replicas }}
  selector: { matchLabels: { app: {{ .Release.Name }}-serving } }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-serving }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8001", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: serving
          image: {{ include "risklens.image" (dict "root" . "name" "serving") }}
          ports: [{ containerPort: 8001 }]
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
          env:
            - { name: MODEL_SOURCE, value: mlflow }
            - { name: MLFLOW_TRACKING_URI, value: {{ .Values.env.MLFLOW_TRACKING_URI | quote }} }
            - { name: MLFLOW_S3_ENDPOINT_URL, value: {{ .Values.env.S3_ENDPOINT_URL | quote }} }
            - { name: HISTORY_BACKEND, value: redis }
            - { name: REDIS_URL, value: "redis://risklens-redis-master:6379/2" }
            - { name: SHADOW_ENABLED, value: {{ .Values.serving.shadowEnabled | quote }} }
            - { name: INTERNAL_TOKEN, valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: SERVING_INTERNAL_TOKEN } } }
          readinessProbe: { httpGet: { path: /health/ready, port: 8001 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 60, periodSeconds: 20 }
          resources: {{- toYaml .Values.serving.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-serving
spec:
  selector: { app: {{ .Release.Name }}-serving }
  ports: [{ port: 8001, targetPort: 8001 }]
{{- if .Values.serving.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-serving
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ .Release.Name }}-serving }
  minReplicas: {{ .Values.serving.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.serving.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.serving.autoscaling.targetCPUUtilizationPercentage }} } }
{{- end }}

# Full RiskLens stack:  docker compose -f infra/docker-compose.yml --env-file .env up -d --build
name: risklens

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
  SECURE_COOKIES: "false"
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/risklens
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  SERVING_URL: http://serving:8001
  SERVING_INTERNAL_TOKEN: ${SERVING_INTERNAL_TOKEN}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  S3_BUCKET: risklens-media
  S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  CSRF_TRUSTED_ORIGINS: http://localhost:3000
  DEMO_PASSWORD: ${DEMO_PASSWORD:-risklens-demo}
  AUTO_RETRAIN_ON_DRIFT: ${AUTO_RETRAIN_ON_DRIFT:-false}
  GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  LOG_JSON: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: risklens
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d risklens"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
             mc mb -p local/mlflow local/risklens-dvc local/risklens-media && echo buckets ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"

  mlflow:
    build: ./mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      retries: 20

  serving:
    build: { context: .., dockerfile: serving/Dockerfile }
    environment:
      MODEL_SOURCE: mlflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LOCAL_FALLBACK: "true"
      CREDIT_MODEL_PATH: /models/credit/scorer.joblib
      FRAUD_MODEL_PATH: /models/fraud/scorer.joblib
      INTERNAL_TOKEN: ${SERVING_INTERNAL_TOKEN}
      SHADOW_ENABLED: ${SHADOW_ENABLED:-false}
      HISTORY_BACKEND: redis
      REDIS_URL: redis://redis:6379/2
      RELOAD_INTERVAL_SECONDS: "300"
    volumes: ["../models:/models:ro"]
    depends_on:
      mlflow: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8001:8001"]

  backend:
    build: { context: .., dockerfile: backend/Dockerfile }
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["8000:8000"]

  worker:
    build: { context: .., dockerfile: backend/Dockerfile }
    command: celery -A config worker -l info --concurrency 2
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      retries: 5

  beat:
    build: { context: .., dockerfile: backend/Dockerfile }
    command: celery -A config beat -l info
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      disable: true

  frontend:
    build: ../frontend
    depends_on:
      backend: { condition: service_healthy }
    ports: ["3000:8080"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./prometheus:/etc/prometheus:ro"]
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s

volumes:
  pgdata:
  miniodata:

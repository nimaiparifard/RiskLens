name: cd
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend, context: ., file: backend/Dockerfile }
          - { name: serving, context: ., file: serving/Dockerfile }
          - { name: frontend, context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/risklens-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    if: vars.DEPLOY_TARGET != ''
    steps:
      - uses: actions/checkout@v4
      - name: deploy (VM via SSH + docker compose)
        if: vars.DEPLOY_TARGET == 'vm'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/risklens && git pull --ff-only
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --env-file .env pull
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --env-file .env up -d
      - name: deploy (Kubernetes via Helm)
        if: vars.DEPLOY_TARGET == 'k8s'
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig && export KUBECONFIG=$PWD/kubeconfig
          helm upgrade --install risklens infra/helm/risklens --wait \
            --set image.registry=ghcr.io/${{ github.repository_owner }} --set image.tag=sha-${{ github.sha }}
      - name: smoke test
        run: |
          for path in /api/health/ /healthz; do
            curl -fsS --retry 10 --retry-delay 6 "${{ vars.PUBLIC_URL }}$path"
          done

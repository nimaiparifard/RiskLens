[project]
name = "risklens-backend"
version = "0.1.0"
description = "RiskLens public API: users, applications, decisions, audit, monitoring (Django + DRF)"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "django-environ>=0.11",
    "django-filter>=24.2",
    "django-cors-headers>=4.4",
    "django-storages[s3]>=1.14",
    "celery[redis]>=5.4",
    "django-celery-beat>=2.6",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "tenacity>=8.3",
    "structlog>=24.1",
    "gunicorn>=22.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# optional: render Evidently HTML drift reports in the worker
monitoring = ["risklens[monitoring]"]
dev = ["pytest>=8", "pytest-django>=4.8", "pytest-cov>=5", "factory-boy>=3.3"]

[tool.uv.sources]
risklens = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["apps", "tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]

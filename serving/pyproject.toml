[project]
name = "risklens-serving"
version = "0.1.0"
description = "RiskLens low-latency model server (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "risklens[serve]",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
risklens = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
